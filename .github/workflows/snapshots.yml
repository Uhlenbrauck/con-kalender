name: Quellen-Snapshots

# Lädt die Recherche-Quellen vor dem täglichen Claude-Lauf (06:52 Berlin) herunter,
# damit der Lauf ohne Webseiten-Freigaben auskommt.
on:
  schedule:
    - cron: "7 4 * * *"   # täglich 04:07 UTC (05:07 / 06:07 Berlin)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/snapshot.mjs
      - name: Snapshots committen (nur bei Änderungen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A snapshots/
          git diff --cached --quiet || (git commit -m "Quellen-Snapshots $(date -u +%F)" && git pull --rebase && git push)
