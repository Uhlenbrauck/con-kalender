name: Quellen-Snapshots

# Lädt die Recherche-Quellen vor dem täglichen Claude-Lauf (06:52 Berlin) herunter,
# damit der Lauf ohne Webseiten-Freigaben auskommt.
on:
  schedule:
    - cron: "7 4 * * *"   # täglich 04:07 UTC (05:07 / 06:07 Berlin)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/snapshot.mjs
      - name: Snapshots committen (nur bei Änderungen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshots beiseitelegen und auf den neuesten Stand von main setzen –
          # so gibt es keine Konflikte, falls zwischendurch jemand gepusht hat.
          mv snapshots "$RUNNER_TEMP/snapshots"
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -B main origin/main
            rm -rf snapshots && cp -r "$RUNNER_TEMP/snapshots" snapshots
            git add -A snapshots/
            if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
            git commit -q -m "Quellen-Snapshots $(date -u +%F)"
            git push -q origin main && exit 0
            sleep 5
          done
          exit 1
